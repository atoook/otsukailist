# テスト環境用 - 軽量、一時的データ
version: "3.8"

services:
  postgres-test:
    image: postgres:16
    container_name: otsukailist_postgres_test
    environment:
      POSTGRES_DB: otsukailist_test
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5433:5432" # 開発環境と競合しないポート
    volumes:
      - ./init/01_create_tables_test.sql:/docker-entrypoint-initdb.d/01_create_tables.sql # テスト専用スキーマ
      # データボリュームなし（テスト後に削除）
    networks:
      - otsukailist_test_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d otsukailist_test"]
      interval: 5s
      timeout: 10s
      retries: 6
      start_period: 30s
    tmpfs:
      - /var/lib/postgresql/data:rw,noexec,nosuid,size=2g # PostgreSQLのデータ領域

networks:
  otsukailist_test_network:
    driver: bridge
