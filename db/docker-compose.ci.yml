# CI/CD環境用 - 最小構成
version: "3.8"

services:
  postgres-ci:
    image: postgres:16
    container_name: otsukailist_postgres_ci
    environment:
      POSTGRES_DB: otsukailist_test
      POSTGRES_USER: test_user
      POSTGRES_PASSWORD: testpassword
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test_user -d otsukailist_test"]
      timeout: 5s
      retries: 3
    tmpfs:
      - /var/lib/postgresql/data:rw,noexec,nosuid,size=256m
