spring:
  # データベース設定
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DATABASE:otsukailist}${POSTGRES_PARAMS:?sslmode=disable}
    username: ${POSTGRES_USER:otsukailist_user}
    password: ${POSTGRES_PASSWORD:otsukailist_password}
    driver-class-name: org.postgresql.Driver

  # JPA設定
  jpa:
    hibernate:
      ddl-auto: validate # 本番ではvalidateを使用
    show-sql: true
    properties:
      hibernate:
        "[format_sql]": true
        dialect: org.hibernate.dialect.PostgreSQLDialect
        # UUID設定
        type:
          "[preferred_uuid_jdbc_type]": UUID

# ログ設定
logging:
  level:
    "[org.hibernate.SQL]": DEBUG
    "[org.hibernate.type.descriptor.sql.BasicBinder]": TRACE
    "[com.atoook.otsukailist]": DEBUG

# アプリケーション設定
server:
  port: ${SERVER_PORT}

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:https://your-production-domain.com}
