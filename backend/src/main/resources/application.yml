spring:
  application:
    name: otsukailist

  # データベース設定
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:otsukailist}?sslmode=${POSTGRES_SSL_MODE:require}${POSTGRES_PARAMS:}
    username: ${POSTGRES_USER:otsukailist_user}
    password: ${POSTGRES_PASSWORD:otsukailist_password}
    driver-class-name: org.postgresql.Driver

  # JPA設定
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        "[format_sql]": false
        dialect: org.hibernate.dialect.PostgreSQLDialect
        # UUID設定
        type:
          "[preferred_uuid_jdbc_type]": UUID

# ログ設定
logging:
  level:
    "[com.atoook.otsukailist]": INFO

# アプリケーション設定
server:
  port: ${PORT:8080}

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
