spring:
  application:
    name: otsukailist

  # データベース設定
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:otsukailist}?sslmode=${POSTGRES_SSL_MODE:require}${POSTGRES_PARAMS:}
    username: ${POSTGRES_USER:otsukailist_user}
    password: ${POSTGRES_PASSWORD:otsukailist_password}
    driver-class-name: org.postgresql.Driver

  # JPA設定
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        "[format_sql]": false
        dialect: org.hibernate.dialect.PostgreSQLDialect
        # UUID設定
        type:
          "[preferred_uuid_jdbc_type]": UUID

  flyway:
    enabled: true
    baseline-on-migrate: true
    validate-on-migrate: true

# ログ設定
logging:
  level:
    "[com.atoook.otsukailist]": INFO

# アプリケーション設定
server:
  port: ${PORT:8080}

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}
  rate-limit:
    enabled: ${APP_RATE_LIMIT_ENABLED:true}
    capacity: ${APP_RATE_LIMIT_CAPACITY:120}
    refill-tokens: ${APP_RATE_LIMIT_REFILL_TOKENS:120}
    refill-period: ${APP_RATE_LIMIT_REFILL_PERIOD:PT1M}
    cache-ttl: ${APP_RATE_LIMIT_CACHE_TTL:PT15M}
    max-clients: ${APP_RATE_LIMIT_MAX_CLIENTS:10000}
    trusted-proxy-count: ${APP_RATE_LIMIT_TRUSTED_PROXY_COUNT:1}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
