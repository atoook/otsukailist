spring.application.name=otsukailist

# Database Configuration
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DATABASE:otsukailist}${POSTGRES_PARAMS:?sslmode=disable}
spring.datasource.username=${POSTGRES_USER:otsukailist_user}
spring.datasource.password=${POSTGRES_PASSWORD:otsukailist_password}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# UUID Configuration
spring.jpa.properties.hibernate.type.preferred_uuid_jdbc_type=UUID
