spring:
  datasource:
    # Render 本番では環境変数のみで解決する前提（必須値はデプロイ設定で注入）
    url: jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT:5432}/${POSTGRES_DB}?sslmode=${POSTGRES_SSL_MODE:require}${POSTGRES_PARAMS:}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    hikari:
      minimum-idle: ${DB_POOL_MINIMUM_IDLE:0}
      idle-timeout: ${DB_POOL_IDLE_TIMEOUT_MS:60000}
  jpa:
    show-sql: false
    properties:
      hibernate:
        "[format_sql]": false
  security:
    user:
      name: ${ACTUATOR_USERNAME}
      password: ${ACTUATOR_PASSWORD}
      roles: ACTUATOR

server:
  port: ${PORT:8080}

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS}

management:
  server:
    port: ${MANAGEMENT_PORT:${PORT:8080}}
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  health:
    db:
      enabled: false
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
