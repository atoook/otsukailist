spring:
  datasource:
    # Render 本番では環境変数のみで解決する前提（必須値はデプロイ設定で注入）
    url: jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT:5432}/${POSTGRES_DB}?sslmode=${POSTGRES_SSL_MODE:require}${POSTGRES_PARAMS:}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    hikari:
      minimum-idle: ${DB_POOL_MINIMUM_IDLE:0}
      idle-timeout: ${DB_POOL_IDLE_TIMEOUT_MS:60000}
  jpa:
    show-sql: false
    properties:
      hibernate:
        "[format_sql]": false
  security:
    user:
      name: ${ACTUATOR_USERNAME}
      password: ${ACTUATOR_PASSWORD}
      roles: ACTUATOR

server:
  port: ${PORT:8080}

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS}
  rate-limit:
    enabled: ${APP_RATE_LIMIT_ENABLED:true}
    capacity: ${APP_RATE_LIMIT_CAPACITY:120}
    refill-tokens: ${APP_RATE_LIMIT_REFILL_TOKENS:120}
    refill-period: ${APP_RATE_LIMIT_REFILL_PERIOD:PT1M}
    mutation-capacity: ${APP_RATE_LIMIT_MUTATION_CAPACITY:30}
    mutation-refill-tokens: ${APP_RATE_LIMIT_MUTATION_REFILL_TOKENS:30}
    mutation-refill-period: ${APP_RATE_LIMIT_MUTATION_REFILL_PERIOD:PT1M}
    cache-ttl: ${APP_RATE_LIMIT_CACHE_TTL:PT15M}
    max-clients: ${APP_RATE_LIMIT_MAX_CLIENTS:10000}
    trusted-proxy-count: ${APP_RATE_LIMIT_TRUSTED_PROXY_COUNT:1}

management:
  server:
    port: ${MANAGEMENT_PORT:${PORT:8080}}
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  health:
    db:
      enabled: false
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
