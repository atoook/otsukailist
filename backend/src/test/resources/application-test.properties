spring.application.name=otsukailist-test

# Test Database Configuration - Docker PostgreSQL Test Environment
# テスト専用環境（ポート5433）
spring.datasource.url=jdbc:postgresql://localhost:5433/otsukailist_test?sslmode=${POSTGRES_SSL_MODE:disable}${POSTGRES_PARAMS:}
spring.datasource.username=${POSTGRES_USER:otsukailist_user}
spring.datasource.password=${POSTGRES_PASSWORD:otsukailist_password}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration for Testing
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# UUID Configuration (same as production)
spring.jpa.properties.hibernate.type.preferred_uuid_jdbc_type=UUID

# Logging Configuration for Testing
logging.level.com.atoook.otsukailist=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE